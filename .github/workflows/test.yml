name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  test-mod-path: my-mod-workspace
  forced-geode-version: "5.11.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      # Clona o SEU repositório atual que contém o seu src/main.cpp e mod.json
      - uses: actions/checkout@v4
        with:
          path: ${{ env.test-mod-path }}

      - name: Verify/Update Mod JSON Version
        shell: bash
        run: |
          GEODE_VERSION="${{ env.forced-geode-version }}"
          mod_json_path="${{ env.test-mod-path }}/mod.json"
          
          if [ ! -f "$mod_json_path" ]; then
            echo "Error: mod.json not found in repository root!"
            exit 1
          fi

          mod_json=$(cat "$mod_json_path")

          # Garante que a versão do Geode no mod.json está exata para 5.11.1
          updated_mod_json=$(echo "$mod_json" | jq \
            --arg geode_version "$GEODE_VERSION" \
            '.geode = $geode_version')

          echo "$updated_mod_json" > "$mod_json_path"
          echo "Geode version synchronized to: $GEODE_VERSION"

      - name: Build the mod
        uses: geode-sdk/build-action@main
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        with:
          sdk: ${{ env.forced-geode-version }}
          build-config: RelWithDebInfo
          path: ${{ env.test-mod-path }}
          export-pdb: true
          bundle-pdb: true
          export-symbols: true
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-action/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
