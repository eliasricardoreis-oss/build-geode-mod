name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  test-mod-path: example-mod-test
  forced-geode-version: "5.11.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: geode-sdk/example-mod
          path: ${{ env.test-mod-path }}

      - name: Modify Example Mod Files
        shell: bash
        run: |
          GEODE_VERSION="${{ env.forced-geode-version }}"
          mod_json_path="${{ env.test-mod-path }}/mod.json"
          mod_json=$(cat "$mod_json_path")

          # Força a versão 5.11.1 no mod.json do projeto
          updated_mod_json=$(echo "$mod_json" | jq \
            --arg geode_version "$GEODE_VERSION" \
            --arg mod_id "seu-nome.ai-pathfinder-bot" \
            --arg mod_name "AI Pathfinding Bot" \
            --arg mod_version "1.0.0" \
            --arg mod_description "Bot de pathfinding com Geode e Gemini API" \
            --arg developer "SeuNome" \
            '.geode = $geode_version |
            .id = $mod_id |
            .name = $mod_name |
            .version = $mod_version |
            .description = $mod_description |
            .developer = $developer')

          echo "$updated_mod_json" > "$mod_json_path"
          echo "Forced Geode Version set to: $GEODE_VERSION"

      - name: Build the mod
        uses: ./
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        with:
          sdk: ${{ env.forced-geode-version }}
          build-config: RelWithDebInfo
          path: ${{ env.test-mod-path }}
          export-pdb: true
          bundle-pdb: true
          export-symbols: true
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: actions/checkout@v4

      - uses: ./combine
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
